<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Offline — Unblocked Games G+</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(700px 400px at 20% 0%, #1e1b4b, #070b14 65%);
      color: #f4f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem; text-align: center;
    }
    .card { max-width: 480px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 16px;
      display: grid; place-items: center; font-weight: 900; font-size: 1.4rem;
      background: linear-gradient(135deg, #a855f7, #6366f1 55%, #22d3ee);
      box-shadow: 0 16px 40px rgba(99,102,241,.35);
    }
    h1 { font-size: 1.8rem; margin: 0 0 .5rem; }
    p { color: #9aa9bf; line-height: 1.6; margin: 0 0 1.4rem; }
    .actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 42px; padding: 0 1rem; border-radius: 10px;
      background: rgba(148,163,184,.12); color: #f4f7fb; font-weight: 700;
      text-decoration: none; border: 1px solid rgba(148,163,184,.2);
    }
    a.primary { background: linear-gradient(120deg, #8b5cf6, #6366f1 55%, #22d3ee); border-color: transparent; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">G+</div>
    <h1>You are offline</h1>
    <p>The app shell is cached, but this page needs a connection. The local fallback games work offline once they have been opened before. Reconnect and try again, or open the cached game catalogue.</p>
    <div class="actions">
      <a class="primary" href="/games/">Open catalogue</a>
      <a href="/">Try home</a>
    </div>
  </main>
</body>
</html>
